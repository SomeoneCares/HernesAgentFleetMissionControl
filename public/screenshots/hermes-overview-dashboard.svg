  <line x1="20" y1="114" x2="1180" y2="114" stroke="#1e293b" stroke-width="1" />

  <!-- Hermes Brand -->
  <rect x="40" y="73" width="30" height="30" rx="8" fill="#4cd7f6" fill-opacity="0.15" stroke="#4cd7f6" stroke-width="1" />
  <path d="M 48 83 L 55 79 L 62 83 L 55 87 Z" fill="#4cd7f6" />
  <path d="M 48 89 L 55 85 L 62 89 L 55 93 Z" fill="#4cd7f6" opacity="0.7" />
  
  <text x="80" y="87" class="sans light-text" font-size="14">HERMES</text>
