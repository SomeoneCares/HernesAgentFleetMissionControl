  <text x="168" y="86" text-anchor="middle" class="mono" font-size="9" fill="#4cd7f6" font-weight="700">OS 4.2</text>
  <text x="80" y="99" class="mono muted-text" font-size="8">AUTONOMOUS MISSION CONTROL</text>

