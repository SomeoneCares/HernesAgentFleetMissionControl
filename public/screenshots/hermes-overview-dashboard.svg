    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .neon-text { fill: #4cd7f6; font-weight: 700; }
    .muted-text { fill: #64748b; }
    .sub-text { fill: #94a3b8; }
    .light-text { fill: #f8fafc; font-weight: 600; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="120" r="180" fill="#4cd7f6" opacity="0.07" />
  <circle cx="1050" cy="500" r="220" fill="#8b5cf6" opacity="0.06" />

  <!-- Browser Window Chrome -->
  <rect x="20" y="20" width="1160" height="635" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)" />
  
  <!-- Window Top Bar -->
  <path d="M 20 34 Q 20 20 34 20 L 1166 20 Q 1180 20 1180 34 L 1180 62 L 20 62 Z" fill="#090d15" />
  <line x1="20" y1="62" x2="1180" y2="62" stroke="#1e293b" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="45" cy="41" r="5.5" fill="#ef4444" />
  <circle cx="63" cy="41" r="5.5" fill="#f59e0b" />
  <circle cx="81" cy="41" r="5.5" fill="#10b981" />

