<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="modalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d121f" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .light-text { fill: #f8fafc; font-weight: 600; }
    .muted-text { fill: #64748b; }
  </style>

  <!-- Darkened Background Backdrop -->
  <rect width="1200" height="675" fill="url(#bgGrad3)" />

  <!-- Ambient Glow Behind Modal -->
  <circle cx="600" cy="337" r="300" fill="#4cd7f6" opacity="0.08" />

  <!-- The Settings Modal Window -->
  <g transform="translate(150, 35)">
    <rect x="0" y="0" width="900" height="605" rx="16" fill="url(#modalGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#modalShadow)" />

    <!-- Modal Header -->
    <path d="M 0 16 Q 0 0 16 0 L 884 0 Q 900 0 900 16 L 900 60 L 0 60 Z" fill="#111728" />
    <line x1="0" y1="60" x2="900" y2="60" stroke="#1e293b" stroke-width="1" />

    <circle cx="36" cy="30" r="16" fill="#4cd7f6" fill-opacity="0.15" stroke="#4cd7f6" stroke-width="1" />
    <!-- Gear icon inside circle -->
    <path d="M 32 30 L 40 30 M 36 26 L 36 34" stroke="#4cd7f6" stroke-width="2" />
    
    <text x="64" y="27" class="sans light-text" font-size="14">PORTAL CONFIGURATION &amp; CLUSTER RPC</text>
    <text x="64" y="44" class="mono muted-text" font-size="10">HERMES ENVIRONMENT // GLOBAL TUNING &amp; BRANDING</text>

    <!-- Close Button -->
    <circle cx="865" cy="30" r="14" fill="#1e293b" />
    <text x="865" y="34" text-anchor="middle" class="mono" font-size="12" fill="#94a3b8">✕</text>

    <!-- Modal Tabs Navigation Bar -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="900" height="40" fill="#090d16" />
      <line x1="0" y1="40" x2="900" y2="40" stroke="#1e293b" stroke-width="1" />

      <!-- Tab 1: Server -->
      <text x="30" y="25" class="mono muted-text" font-size="11">Server &amp; RPC</text>

      <!-- Tab 2: Branding (ACTIVE) -->
      <rect x="140" y="0" width="180" height="40" fill="#4cd7f6" fill-opacity="0.08" />
      <line x1="140" y1="39" x2="320" y2="39" stroke="#4cd7f6" stroke-width="2" />
      <circle cx="160" cy="20" r="6" fill="#4cd7f6" fill-opacity="0.2" stroke="#4cd7f6" stroke-width="1" />
      <text x="175" y="25" class="mono" font-size="11" fill="#4cd7f6" font-weight="700">Branding &amp; Identity</text>

      <!-- Tab 3: Storage -->
      <text x="345" y="25" class="mono muted-text" font-size="11">Content Library</text>

      <!-- Tab 4: Swarm Defaults -->
      <text x="475" y="25" class="mono muted-text" font-size="11">Swarm Defaults</text>

      <!-- Tab 5: Plugins -->
      <text x="610" y="25" class="mono muted-text" font-size="11">Plugins (8)</text>

      <!-- Tab 6: Backup -->
      <text x="720" y="25" class="mono muted-text" font-size="11">Snapshots</text>
    </g>

    <!-- Modal Body Content: Branding Section -->
    <g transform="translate(30, 115)">
      <!-- Banner -->
      <rect x="0" y="0" width="840" height="54" rx="10" fill="#082f49" fill-opacity="0.3" stroke="#0284c7" stroke-width="0.8" />
      <circle cx="28" cy="27" r="14" fill="#0284c7" fill-opacity="0.2" />
      <path d="M 23 27 L 33 27 M 28 22 L 28 32" stroke="#38bdf8" stroke-width="2" />
      <text x="52" y="24" class="sans light-text" font-size="13">Mission Control Branding &amp; Visual Identity</text>
      <text x="52" y="39" class="mono muted-text" font-size="10">Personalize portal callsign, tactical badge, organization insignia, brand logo emblem, and compliance disclaimer.</text>
      <rect x="740" y="14" width="86" height="26" rx="6" fill="#1e293b" />
      <text x="783" y="31" text-anchor="middle" class="mono" font-size="9" fill="#94a3b8">Reset Defaults</text>

      <!-- Live Header Preview Card -->
      <g transform="translate(0, 66)">
        <rect x="0" y="0" width="840" height="84" rx="10" fill="#060911" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="22" class="mono" font-size="9" fill="#4cd7f6" font-weight="700">● LIVE HEADER PREVIEW</text>
        <text x="710" y="22" class="mono muted-text" font-size="9">Simulated Top Navigation</text>

        <!-- Simulated Brand Bar -->
        <g transform="translate(16, 32)">
          <rect x="0" y="0" width="808" height="42" rx="8" fill="#0b101c" stroke="#334155" stroke-width="0.8" />
          
          <rect x="12" y="7" width="28" height="28" rx="6" fill="#4cd7f6" fill-opacity="0.2" stroke="#4cd7f6" stroke-width="1" />
          <path d="M 20 18 L 26 14 L 32 18 L 26 22 Z" fill="#4cd7f6" />
          <path d="M 20 23 L 26 19 L 32 23 L 26 27 Z" fill="#4cd7f6" opacity="0.7" />

          <text x="48" y="22" class="sans light-text" font-size="13">HERMES</text>
          <rect x="108" y="11" width="44" height="16" rx="3" fill="#4cd7f6" fill-opacity="0.15" stroke="#4cd7f6" stroke-width="0.6" />
          <text x="130" y="23" text-anchor="middle" class="mono" font-size="9" fill="#4cd7f6" font-weight="700">OS 4.2</text>
          <text x="48" y="32" class="mono muted-text" font-size="8">AUTONOMOUS MISSION CONTROL</text>

          <!-- Org Insignia -->
          <rect x="630" y="11" width="166" height="20" rx="10" fill="#141c2e" stroke="#1e293b" stroke-width="0.8" />
          <text x="713" y="24" text-anchor="middle" class="mono" font-size="9" fill="#94a3b8">SOVEREIGN AGENT CLUSTER</text>
        </g>
      </g>

      <!-- Preset Buttons -->
      <g transform="translate(0, 162)">
        <text x="0" y="14" class="mono muted-text" font-size="10">CURATED BRAND PRESETS</text>
        
        <g transform="translate(0, 22)">
          <!-- Preset 1 -->
          <rect x="0" y="0" width="200" height="42" rx="8" fill="#0b101c" stroke="#4cd7f6" stroke-width="1" />
          <circle cx="16" cy="21" r="5" fill="#4cd7f6" />
          <text x="30" y="19" class="sans light-text" font-size="11">Hermes Cyber Core</text>
          <text x="30" y="32" class="mono muted-text" font-size="9">HERMES [OS 4.2]</text>

          <!-- Preset 2 -->
          <rect x="213" y="0" width="200" height="42" rx="8" fill="#0b101c" stroke="#1e293b" stroke-width="1" />
          <circle cx="229" cy="21" r="5" fill="#38bdf8" />
          <text x="243" y="19" class="sans light-text" font-size="11">Titan Deep Space</text>
          <text x="243" y="32" class="mono muted-text" font-size="9">TITAN [ORBIT 4.0]</text>

          <!-- Preset 3 -->
          <rect x="426" y="0" width="200" height="42" rx="8" fill="#0b101c" stroke="#1e293b" stroke-width="1" />
          <circle cx="442" cy="21" r="5" fill="#10b981" />
          <text x="456" y="19" class="sans light-text" font-size="11">Matrix Neural Mesh</text>
          <text x="456" y="32" class="mono muted-text" font-size="9">MATRIX [CORE v3]</text>

          <!-- Preset 4 -->
          <rect x="640" y="0" width="200" height="42" rx="8" fill="#0b101c" stroke="#1e293b" stroke-width="1" />
          <circle cx="656" cy="21" r="5" fill="#f59e0b" />
          <text x="670" y="19" class="sans light-text" font-size="11">Aegis Sentinel</text>
          <text x="670" y="32" class="mono muted-text" font-size="9">AEGIS [DEF-9]</text>
        </g>
      </g>

      <!-- Form Inputs Grid -->
      <g transform="translate(0, 240)">
        <!-- Portal Name Field -->
        <text x="0" y="14" class="mono muted-text" font-size="10">PORTAL CALLSIGN</text>
        <rect x="0" y="22" width="405" height="34" rx="8" fill="#070a12" stroke="#334155" stroke-width="1" />
        <text x="14" y="44" class="mono light-text" font-size="12">HERMES</text>

        <!-- Version Tag Field -->
        <text x="435" y="14" class="mono muted-text" font-size="10">VERSION / TACTICAL BADGE</text>
        <rect x="435" y="22" width="405" height="34" rx="8" fill="#070a12" stroke="#334155" stroke-width="1" />
        <text x="449" y="44" class="mono" font-size="12" fill="#4cd7f6" font-weight="700">OS 4.2</text>
      </g>

      <!-- Logo Emblem Selector -->
      <g transform="translate(0, 310)">
        <text x="0" y="14" class="mono muted-text" font-size="10">PORTAL EMBLEM / LOGO ICON (10 CYBERNETIC PRESETS)</text>
        <g transform="translate(0, 22)">
          <!-- 10 Icon buttons -->
          <rect x="0" y="0" width="75" height="38" rx="6" fill="#4cd7f6" fill-opacity="0.15" stroke="#4cd7f6" stroke-width="1.5" />
          <text x="37" y="24" text-anchor="middle" class="mono" font-size="10" fill="#4cd7f6" font-weight="700">Layers</text>

          <rect x="85" y="0" width="75" height="38" rx="6" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
          <text x="122" y="24" text-anchor="middle" class="mono muted-text" font-size="10">Bot</text>

          <rect x="170" y="0" width="75" height="38" rx="6" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
          <text x="207" y="24" text-anchor="middle" class="mono muted-text" font-size="10">Shield</text>

          <rect x="255" y="0" width="75" height="38" rx="6" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
          <text x="292" y="24" text-anchor="middle" class="mono muted-text" font-size="10">Terminal</text>

          <rect x="340" y="0" width="75" height="38" rx="6" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
          <text x="377" y="24" text-anchor="middle" class="mono muted-text" font-size="10">Flame</text>

          <rect x="425" y="0" width="75" height="38" rx="6" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
          <text x="462" y="24" text-anchor="middle" class="mono muted-text" font-size="10">Sparkles</text>

          <rect x="510" y="0" width="75" height="38" rx="6" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
          <text x="547" y="24" text-anchor="middle" class="mono muted-text" font-size="10">Orbit</text>

          <rect x="595" y="0" width="75" height="38" rx="6" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
          <text x="632" y="24" text-anchor="middle" class="mono muted-text" font-size="10">CPU</text>

          <rect x="680" y="0" width="75" height="38" rx="6" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
          <text x="717" y="24" text-anchor="middle" class="mono muted-text" font-size="10">Network</text>

          <rect x="765" y="0" width="75" height="38" rx="6" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
          <text x="802" y="24" text-anchor="middle" class="mono muted-text" font-size="10">Zap</text>
        </g>
      </g>

      <!-- Color Swatches & Save Bar -->
      <g transform="translate(0, 390)">
        <text x="0" y="14" class="mono muted-text" font-size="10">BRAND ACCENT COLOR</text>
        
        <g transform="translate(0, 22)">
          <circle cx="15" cy="15" r="12" fill="#4cd7f6" stroke="#ffffff" stroke-width="2" />
          <circle cx="50" cy="15" r="12" fill="#10b981" />
          <circle cx="85" cy="15" r="12" fill="#a855f7" />
          <circle cx="120" cy="15" r="12" fill="#f59e0b" />
          <circle cx="155" cy="15" r="12" fill="#f43f5e" />
          <circle cx="190" cy="15" r="12" fill="#38bdf8" />
          <circle cx="225" cy="15" r="12" fill="#8b5cf6" />
          
          <rect x="260" y="3" width="90" height="24" rx="6" fill="#070a12" stroke="#334155" stroke-width="1" />
          <text x="305" y="19" text-anchor="middle" class="mono" font-size="11" fill="#4cd7f6">#4cd7f6</text>

          <!-- Status badge -->
          <rect x="680" y="0" width="160" height="30" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
          <text x="760" y="19" text-anchor="middle" class="mono" font-size="10" fill="#34d399" font-weight="700">✓ LIVE AUTO-SAVED</text>
        </g>
      </g>
    </g>
  </g>
</svg>
